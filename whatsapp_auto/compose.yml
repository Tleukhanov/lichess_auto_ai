services:
  waha:
    # Шлюз WhatsApp: QR-сессия сканируется в дашборде http://localhost:3000
    image: devlikeapro/waha:latest
    env_file:
      - ../.env
    environment:
      # Движок без браузера (websocket): QR не зависит от версии веб-клиента.
      # GOWS — современный Go-клиент (NOWEB упирался в обрыв соединения)
      - WHATSAPP_DEFAULT_ENGINE=GOWS
      # Общий неймспейс: API-ключ и конфиг не меняются при смене движка
      - WAHA_NAMESPACE=all
      # Фиксированный API-ключ из .env (иначе генерируется заново при смене неймспейса)
      - WAHA_API_KEY=${WAHA_API_KEY}
    ports:
      - "3000:3000"
    volumes:
      - waha_data:/app/.sessions
      - waha_data:/app/.store
    restart: unless-stopped

  api:
    # Наш бот: вебхук + анонсы + RAG. WAHA_URL внутри сети = http://waha:3000
    build: .
    ports:
      - "5000:5000"
    env_file:
      - ../.env
    environment:
      - WAHA_URL=http://waha:3000
    depends_on:
      - waha
    restart: unless-stopped

volumes:
  waha_data:
