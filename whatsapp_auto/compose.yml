services:
  waha:
    # Шлюз WhatsApp: QR-сессия сканируется в дашборде http://localhost:3000
    image: devlikeapro/waha:latest
    env_file:
      - ../.env
    environment:
      # Движок без браузера (websocket): QR не зависит от версии веб-клиента.
      # Перебраны: WEBJS (сломан refreshQR), NOWEB/GOWS (рвётся websocket).
      # WPP — браузерный, другая библиотека (wppconnect), пробуем его.
      - WHATSAPP_DEFAULT_ENGINE=WPP
      # Общий неймспейс: API-ключ и конфиг не меняются при смене движка
      - WAHA_NAMESPACE=all
      # Фиксированный API-ключ из .env (иначе генерируется заново при смене неймспейса)
      - WAHA_API_KEY=${WAHA_API_KEY}
    ports:
      - "3000:3000"
    volumes:
      - waha_data:/app/.sessions
      - waha_data:/app/.store
    restart: unless-stopped

  api:
    # Наш бот: вебхук + анонсы + RAG. WAHA_URL внутри сети = http://waha:3000.
    # Контекст сборки — корень репо: пакет whatsapp_auto копируется целиком.
    build:
      context: ..
      dockerfile: whatsapp_auto/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ../.env
    environment:
      - WAHA_URL=http://waha:3000
      # БД федерации с хоста (аналитика и бот смотрят одни данные)
      - DB_PATH=/app/data/federation.db
    volumes:
      - ../backend/db:/app/data
      # Кэш моделей (whisper ~500МБ качается раз, дальше с диска)
      - hf_cache:/root/.cache
    depends_on:
      - waha
    restart: unless-stopped

volumes:
  waha_data:
  hf_cache:
